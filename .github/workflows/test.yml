name: Test

on:
  pull_request:
    paths:
      - "profile_gen/**"
      - "tests/**"
      - "profile.config.json"
  push:
    branches: [master]
    paths:
      - "profile_gen/**"
      - "tests/**"
      - "profile.config.json"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
